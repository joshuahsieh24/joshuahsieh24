name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-tokyo.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#1a1b26,#414868,#7aa2f7,#9ece6a,#bb9af7

      - name: Play once and stop (no loop)
        # The snk SVG loops via CSS `... infinite`. Swap it for a single pass
        # that holds the final frame, so the snake runs through once and parks.
        run: sed -i 's/ infinite/ 1 forwards/g' dist/github-snake-tokyo.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
